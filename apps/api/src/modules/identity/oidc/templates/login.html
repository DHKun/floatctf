{% extends "layout.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<h1>登录 FloatCTF</h1>
<p class="muted">登录后将继续授权给以下应用：</p>
<div class="app"><strong>{{ client_name }}<span class="badge">第三方应用</span></strong>{% if client_host %}<span class="muted">{{ client_host }}</span>{% endif %}</div>
{% if reauth %}<div class="notice">该应用要求你重新验证身份。</div>{% endif %}
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ action }}" autocomplete="on">
  <input type="hidden" name="txn" value="{{ txn }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="field" for="username">用户名</label>
  <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required maxlength="64" value="{{ username }}" {% if not username %}autofocus{% endif %}>
  <label class="field" for="password">密码</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" {% if username %}autofocus{% endif %}>
  <div class="actions">
    <button type="submit" name="action" value="cancel" formnovalidate>取消</button>
    <button type="submit" name="action" value="login" class="primary">登录</button>
  </div>
</form>
{% endblock %}
